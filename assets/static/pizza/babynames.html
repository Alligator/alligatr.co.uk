<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="d3.min.js" charset="utf-8"></script>
  <script type="text/javascript">
  var width = 800;
  var height = 600;
  var margin = 50;

  var yScale = d3.scale.linear()
  .range([0, height - margin])
  .domain([0, 19]);

  d3.json('babynames.json', function(data) {
    var svg = d3.select('#chart').append('svg')
      .attr('width', width)
      .attr('height', height).append('g')
      .attr('transform', 'translate(' + (margin/2) + ',' + (margin/2) + ')');

    var years = [];
    data.forEach(function (d) { years.push(d.year); });

    var xScale = d3.scale.linear()
      .range([margin, width - margin])
      .domain(d3.extent(years));

    var t = svg.selectAll('.bla')
    .data(data, function(d) { return d.female; });

    // thing.append('rect')
    //   .attr('width', 15)
    //   .attr('height', 15)
    //   .attr('x', 55).attr('rx', 3)
    //   .attr('y', function(d, i) { return yScale(i)-12; }).attr('ry', 3)
    //   .attr('fill', 'black');
    t.enter()
      .append('g')
      .attr('transform', function(d, i) { return 'translate(' + xScale(d.year) + ',0)'; })
      .data(function (d, i) { return d.female; })
        .append('text')
        .attr('y', function(d, i) { return yScale(i); })
        .attr('text-anchor', 'end')
          .text(function(d) { console.log(d); return d; });
  });
  </script>
  <style type="text/css">
  #chart {
    width: 800px;
    height: 600px;
    border: 1px solid black;
  }
  </style>
</head>
<body>
  <div id="chart"></div>
</body>
</html>
