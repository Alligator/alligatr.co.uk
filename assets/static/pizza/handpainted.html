    padding: 0;
  }

    text-align: center;
  }

    margin: 0;
    padding: 1em;
    font-size: 6em;
  }
  a, a:hover, a:visited {
    text-decoration: none;
    color: inherit;
  }

                 -.065em .175em #e1e4ec,
                 -.065em .180em #e1e4ec,
                 -.065em .185em #e1e4ec;
}

.inset {
  color: #ea3;
  font-family: 'Playfair Display', serif;
  /* background-color: rgb(228, 143, 0); */
  background-color: rgb(0, 104, 109);
  text-shadow: .04em 0 #fe6,
               .06em 0 #ea3,
               .08em 0 #ea3,
               -.02em .02em black,
               -.04em .04em black,
               -.06em .06em black,
               -.08em .08em black,

               -.11em .11em #099;
}

.twotone {
  font-family: 'Sancreek', serif;
  color: #fb5;
  background-color: #922;
}
.twotone div {
  position: relative;
  text-shadow: 3px 3px   #922,
              -3px 3px   #922,
               5px 5px   black,
               7px 7px   black,
               9px 9px   black,
               11px 11px black,
               13px 13px black;
}
.twotone div:before {
  content: 'ALLIGATOR';
  height: .66em;
  position: absolute;
  color: #edd;
  overflow: hidden;
}
.simple {
  font-family: 'Raleway', sans-serif;
  background-color: #ea3;
  text-shadow: 02px 02px #edb,
               04px 04px #edb,
               06px 06px #edb,
               08px 08px #edb,
               10px 10px #edb;
}
.inverted {
  font-family: 'Hammersmith One', sans-serif;
  background-color: #110;
  color: #cb7;
  border: 4px solid #cb7;
  outline: 12px solid #110;
  margin: 8px;
}
.chunky {
  font-family: 'Hammersmith One', sans-serif;
  background-color: #135;
  color: #c77;
  letter-spacing: .1em;
  text-shadow:
    2px 1px #357,
    2px 1px #579,
    2px 3px #357,
    3px 2px #579,
    3px 4px #357,

    6px 7px #357,
    7px 6px #579,
    7px 8px #357,
    8px 7px #579,
    8px 9px #357;
}

  color: #c7c7c7;
  letter-spacing: .1em;
  text-shadow:
   -3px 0px #282828,
