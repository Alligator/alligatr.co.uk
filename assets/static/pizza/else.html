  /*** spherize n stuff ***/
  var spherize = function(px,py,width,height) {
    var x = px-width/2;
    var y = py-height/2;
    var r = Math.sqrt(x*x+y*y);
    var maxr = width/2;
    if (r>maxr) return [px, py];
    var a = -Math.atan2(y,x);
    var k = (r/maxr)*(r/maxr)*0.05-1.05;
    var dx = -Math.cos(a)*r*k;
    var dy = Math.sin(a)*r*k;
    return [Math.round(dx+width/2), Math.round(dy+height/2)];
  }

  function Screen(width, height, rate) {
    var s = {};

    // public
    var chars = []; s.chars = chars;
    var dirty = []; s.dirty = dirty;
    s.width  = width;
    s.height = height;

    // private
    var queue = [];
    rate = rate || 33;

    function put(c, x, y) {
      queue.push({c:c, x:x, y:y});
    }

    setInterval(function() {
      var t = queue.shift();
      if (t) {
        chars[t.x][t.y] = t.c;
        dirty[t.x][t.y] = true;
      }
    }, rate);

    s.putc = function(c, x, y) {
      put(c, x, y);
    }
    s.puts = function(s, x, y) {
      x = x || 0;
      y = y || 0;
      var offset = 0;
      for (var i = 0; i < s.length; i++) {
        if (x + offset > width-1) {
          offset = 0;
          y++;
        }
        if (y > height-1) break;
        put(s[i], x + offset, y);
        offset++;
      }
    }
    s.clear = function() {
      init_chars();
    }

    function init_chars() {
      for (var x = 0; x < width; x++) {
        chars[x] = [];
        dirty[x] = [];
        for (var y = 0; y < width; y++) {
          chars[x][y] = ' ';
          dirty[x][y] = true;
        }
      }
    }
    init_chars();

    return s;
  }
