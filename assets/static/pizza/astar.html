<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script type="text/javascript">
  window.onload = function() {
    var canvas = document.getElementById('canv');
    var ctx = canvas.getContext('2d');

    var width  = canvas.width  = 500;
    var height = canvas.height = 500;

    var cell_size = 10;
    var grid = [];
    for (var i = 0; i < 50; i++) {
      grid[i] = [];
      for (var j = 0; j < 50; j++) {
        grid[i][j] = 0;
      }
    }

    grid[36][26] = 1;
    grid[36][27] = 1;
    grid[36][28] = 1;
    grid[36][29] = 1;
    grid[36][30] = 1;
    grid[36][31] = 1;

    var playerx = 20;
    var playery = 20;
    grid[playerx][playery] = 2;

    var destx = 45;
    var desty = 30;

    grid[destx][desty] = 3;
    var colors = ['',
      'black', // wall
      'green', // player
      'red',   // destination
      'yellow',// check
    ];

    var ls = [[0.0, [[playerx, playery]]]];

    function update() {
      // find the shortest path
      var shortest = ls[0];
      for (var i = 0; i < ls.length; i++)
        if (ls[i][0] < shortest[0])
          shortest = ls[i];

      // expand
      for (var i = -1; i <= 1; i++) {
      }
    }

    function draw() {
      ctx.save();
      ctx.strokeStyle = 'black';
      ctx.lineWidth = 1;
      for (var x = 0; x < grid[0].length; x++) {
        ctx.beginPath();
        ctx.moveTo(x * cell_size, 0);
        ctx.lineTo(x * cell_size, height);
        ctx.stroke();
        for (var y = 0; y < grid.length; y++) {
          if (x == 0) {
            ctx.beginPath();
            ctx.moveTo(0, y * cell_size);
            ctx.lineTo(width, y * cell_size);
            ctx.stroke();
          }
          if (grid[x][y] > 0) {
            ctx.fillStyle = colors[grid[x][y]];
            ctx.fillRect(x * cell_size, y * cell_size, cell_size, cell_size);
          }
        }
      }
      ctx.restore();
    }

    update();
    draw();
  }
  </script>
</head>
<body>
  <canvas id="canv"></canvas>
</body>
</html>
