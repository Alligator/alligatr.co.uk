<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="d3.min.js" charset="utf-8"></script>
  <script type="text/javascript">
  var width = 440;
  var height = 1000;

  d3.json('rainfall.json', function(error, rain) {
    // calc max and min
    var max = d3.max(rain, function(d) { return d.rain });
    var min = d3.min(rain, function(d) { return d.rain });

    var max_year = d3.max(rain, function(d) { return d.year });
    var min_year = d3.min(rain, function(d) { return d.year });

    var years = [];
    rain.forEach(function (d) {
      if (years.indexOf(d.year) == -1) {
        years.push(d.year);
      }
    });
    years = years.sort();

    rain = rain.sort(function(a, b) {
      return a.year - b.year;
    }).reverse();

    var grid_width = Math.floor(width/12);
    var grid_height = Math.floor(height/(max_year - min_year));

    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var colors = ["#003056", "#0E516B", "#1C7380", "#2A9595", "#38B7AA", "#47D9BF", "#9CD47D", "#F2D03B"]

    var color_scale = d3.scale.quantile()
      .domain([0, max])
      .range(colors);

    var scale = d3.scale.quantile()
      .domain([0, max])
      .range(d3.range(grid_height, grid_height*3));

    var svg = d3.select('#chart').append('svg')
      .attr('width', width*1.8)
      .attr('height', height)
      .append('g')
      .attr('transform', 'translate(56,0)');

    var current_year = 1984;

    var heat_map = svg.selectAll('.thing')
      .data(rain)
      .enter().append('g');
    heat_map.append('rect')
      // .filter(function(d) { return d.year <= current_year; })
      .attr('x', function(d, i) { return (d.month * grid_width) + 28 })
      .attr('y', function(d, i) { return Math.abs((grid_height * years.length) - ((max_year - d.year) * grid_height)); })
      .attr('class', 'month')
      .attr('width', grid_width)
      .attr('height', grid_height)
      .style('fill', function(d) { return color_scale(d.rain); });

    var year_labels = svg.selectAll('.yearlabel')
      .data(years)
      .enter().append('text')
      .text(function(d) { return d; })
      .attr('x', 0)
      .attr('y', function(d, i) { return Math.abs((grid_height * years.length) - ((max_year - d - 1) * grid_height)); })
      .attr('class', 'label');
      //.style('text-anchor', 'end');

    var month_labels = svg.selectAll('.monthlabel')
      .data(months)
      .enter().append('text')
      .text(function(d) { return d; })
      .attr('x', function(d, i) { return (i + 1) * grid_width; })
      .attr('y', grid_height - 2)
      .attr('class', 'label');
  });
  </script>
  <style type="text/css">
  body {
    font-family: sans-serif;
    background: #00223C;
    color: #99cbcf;
  }
  .label {
    fill: #99cbcf;
    font-size: 8pt;
  }
  .month {
    stroke-width: 1px;
    stroke: #142933;
    shape-rendering: crispEdges;
  }

  .content {
    width: 580px;
    margin: 0 auto;
  }
  
  h1 {
    text-align: center;
  }
  </style>
</head>
<body>
  <div class="content">
    <h1>UK Rainfall per month 1910 - 2013</h1>
    <div id="chart"></div>
  </div>
</body>
</html>
